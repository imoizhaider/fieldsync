name: Keep Supabase awake

# A free Supabase project pauses after 7 days without database activity.
# This makes one small query every 3 days. Optional: delete this file if you
# prefer to open the dashboard by hand before a demo.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: One query through the REST API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY repository variables are not set"; exit 1
          fi
          # Row Level Security returns no rows without a login; the query still reaches the database.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/regions?select=id&limit=1")
          echo "HTTP $code"
          [ "$code" -lt 500 ]
