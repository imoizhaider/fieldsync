# Netlify: set SUPABASE_URL and SUPABASE_ANON_KEY under Site settings, Environment variables.
[build]
  command = "npm run build && npm run scan"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
